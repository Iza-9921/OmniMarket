# Mantiene despierta la base de datos de producción durante la semana de
# evaluación.
#
# En el plan gratis de Neon la base se suspende tras 5 minutos sin uso y la
# primera petición después espera ~700 ms a que despierte (objetivo < 300 ms).
# Este flujo consulta /api/test/analytics cada 4 minutos.
#
# Los `schedule` de GitHub pueden retrasarse o no ejecutarse (pasó al activarlo),
# así que no dependemos de ellos: cada ejecución hace ping durante casi 6 horas
# (el máximo de un job) y antes de terminar se vuelve a lanzar con
# workflow_dispatch. El `schedule` y el `push` solo arrancan una cadena si no
# hay otra en curso; si la hay, terminan en segundos sin hacer nada.
#
# Presupuesto: despierta 24 h consume ~6 CU-hora al día (0.25 CU) de las 100 del
# mes en el plan gratis. Por eso se detiene sola en STOP_AT.
name: Mantener despierta la base de datos

on:
  push:
    branches: [main]
    paths: [.github/workflows/keep-warm.yml]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write

env:
  URL: https://omnimarket-psi.vercel.app/api/test/analytics?page=1&limit=1
  # Sábado 31 de octubre de 2026, 23:59 en la Ciudad de México.
  STOP_AT: "2026-11-01T05:59:00Z"

jobs:
  ping:
    name: Ping a producción
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: ¿Ya hay una cadena en curso?
        id: chain
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-warm.yml/runs?status=in_progress" \
            | jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          echo "Otras ejecuciones en curso: $others"
          if [ "$others" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Ping cada 4 minutos durante 5 h 50 min
        if: steps.chain.outputs.skip != 'true'
        run: |
          end=$(( $(date +%s) + 350 * 60 ))
          stop=$(date -d "$STOP_AT" +%s)
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ "$(date +%s)" -ge "$stop" ]; then
              echo "Fin de la semana de evaluación: ya no se hace ping."
              exit 0
            fi
            curl -s -o /dev/null --max-time 20 \
              -w "$(date -u +%H:%M:%S) HTTP %{http_code} en %{time_total}s\n" \
              "$URL" || echo "$(date -u +%H:%M:%S) sin respuesta"
            sleep 240
          done

      - name: Relanzar la cadena
        if: success() && steps.chain.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%s)" -ge "$(date -d "$STOP_AT" +%s)" ]; then
            echo "Semana de evaluación terminada: no se relanza."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-warm.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Siguiente ejecución lanzada."
