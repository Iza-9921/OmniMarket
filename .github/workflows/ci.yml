# Pipeline de integración y despliegue continuo (§5 de la especificación).
#
# El despliegue automático de Vercel desde Git está desactivado (vercel.json),
# así que la única vía a producción es el job `deploy`, que depende de que
# pasen `quality`, `integration` y `e2e`. Si falla cualquier prueba, no se despliega.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos, formato y pruebas unitarias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test

  integration:
    name: Pruebas de integración (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omnimarket_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/omnimarket_ci # BD efímera de CI
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run test:integration

  e2e:
    name: Build y pruebas E2E
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omnimarket_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/omnimarket_ci # BD efímera de CI
      # Valores solo para CI; los de producción viven en Vercel.
      TEST_ENDPOINTS_TOKEN: ci-e2e-token-no-es-secreto
      AUTH_SECRET: ci-auth-secret-solo-para-pruebas-e2e-0001
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Despliegue a producción (Vercel)
    needs: [quality, integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Comprobar secretos de Vercel
        run: |
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name en GitHub (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --global vercel@62.0.0
      # El build se hace en Vercel: allí están las variables sensibles de Neon y
      # vercel.json ejecuta las migraciones antes de `next build`.
      - id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado en $url"
      # Comprueba el cuerpo de las respuestas, no solo el código HTTP: si la
      # protección de Vercel está activa, la URL devuelve un 302 al login.
      - name: Verificar el despliegue
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          check() {
            body=$(curl --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$DEPLOY_URL$1")
            echo "$1 → $body" | cut -c1-300
            if ! echo "$body" | grep -q "$2"; then
              echo "::error::$DEPLOY_URL$1 no respondió lo esperado ($2)."
              exit 1
            fi
          }
          check /api/health '"status":"ok"'
          check "/api/test/analytics?limit=1" '"pagination"'
