# Pipeline de integración y despliegue continuo (§5 de la especificación).
#
# El despliegue automático de Vercel desde Git está desactivado (vercel.json),
# así que la única vía a producción es el job `deploy`, que depende de que
# pasen `quality` y `e2e`. Si falla cualquier prueba, no se despliega.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Lint, tipos, formato y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: |
          echo "node $(node --version) · npm $(npm --version)"
          if ! npm ci > npm-ci.log 2>&1; then
            cat npm-ci.log
            echo "::error title=npm ci::$(grep -m 8 'npm error' npm-ci.log | tr '\n' ' ')"
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test

  e2e:
    name: Build y pruebas E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: |
          echo "node $(node --version) · npm $(npm --version)"
          if ! npm ci > npm-ci.log 2>&1; then
            cat npm-ci.log
            echo "::error title=npm ci::$(grep -m 8 'npm error' npm-ci.log | tr '\n' ' ')"
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Despliegue a producción (Vercel)
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Comprobar secretos de Vercel
        run: |
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name en GitHub (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global vercel@62.0.0
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado en $url"
      # Comprueba el cuerpo de la respuesta, no solo el código HTTP: si la
      # protección de Vercel está activa, la URL devuelve un 302 al login.
      - name: Verificar el despliegue
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          body=$(curl --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "$DEPLOY_URL/api/health")
          echo "$body"
          if ! echo "$body" | grep -q '"status":"ok"'; then
            echo "::error::$DEPLOY_URL/api/health no respondió status ok. ¿Está activa la protección de despliegues de Vercel?"
            exit 1
          fi
